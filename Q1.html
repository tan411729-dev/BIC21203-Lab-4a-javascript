<!DOCTYPE html>
<html>
    <head>
        <title>BIC21203 Lab 4a - Q1</title>
    </head>
    <body>
        <div id="myElement">
            <p id="message">Welcome to my website!</p>
        </div>
        <button id="changeBtn" type="button">Change Message</button>
        
        <script>
            const changeBtn = document.getElementById("changeBtn");
            const messagePara = document.getElementById("message");

            changeBtn.addEventListener("click", changeMessage);

            function changeMessage() 
            {
                messagePara.textContent = "Hello there!";
            }
        </script>
    </body>
</html>
